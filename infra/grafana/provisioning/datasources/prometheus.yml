apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_URL}
    isDefault: true
    editable: false
    basicAuth: true
    basicAuthUser: ${PROMETHEUS_WEB_USERNAME}
    secureJsonData:
      basicAuthPassword: ${PROMETHEUS_WEB_PASSWORD}
    jsonData:
      timeInterval: 5s
