groups:
  - name: payment-provider-health
    rules:
      - alert: ProviderP95LatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, provider) (
              rate(apm_client_request_duration_seconds_bucket[2m])
            )
          ) > 0.8
        for: 30s
        keep_firing_for: 30s
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.provider }} p95 latency is above 800 ms"

      - alert: ProviderErrorRateHigh
        expr: |
          sum by (provider) (
            rate(apm_client_requests_total{outcome=~"provider-error|timeout|transport-error"}[2m])
          )
          /
          clamp_min(sum by (provider) (rate(apm_client_requests_total[2m])), 0.001)
          > 0.05
        for: 30s
        keep_firing_for: 30s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.provider }} error rate is above 5%"

      - alert: ProviderHealthDown
        expr: apm_client_provider_health == 0
        for: 15s
        keep_firing_for: 30s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.provider }} health check is down"
