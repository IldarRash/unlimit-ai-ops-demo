global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: provider-emulator
    metrics_path: /metrics
    static_configs:
      - targets:
          - provider-emulator:8000

  - job_name: traffic-generator
    metrics_path: /metrics
    static_configs:
      - targets:
          - traffic-generator:8001

  - job_name: incident-api
    metrics_path: /metrics
    static_configs:
        - targets:
            - incident-api:8002
    authorization:
      type: Bearer
      credentials: __APM_INCIDENT_METRICS_TOKEN__
